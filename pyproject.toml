[project]
name = "openclaw-coolify-tailnet-inventory"
version = "0.1.0"
description = "Read-only OpenClaw infrastructure inventory helpers and skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
check-tailnet-urls = "diagnostics.cli:main"
diagnose-tailnet-service = "diagnostics.diagnose_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["inventory_lib*", "diagnostics*"]
